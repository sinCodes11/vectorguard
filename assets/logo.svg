<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  <g transform="translate(100,100)">
    <g opacity="0.06">
      <line x1="-60" y1="-60" x2="60" y2="60" stroke="#a855f7" stroke-width="1"/>
      <line x1="-60" y1="60" x2="60" y2="-60" stroke="#a855f7" stroke-width="1"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#a855f7" stroke-width="1"/>
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#a855f7" stroke-width="1"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="url(#accent)" filter="url(#glow)"/>
    <g stroke="url(#accent)" stroke-width="1.2" fill="none" opacity="0.5">
      <path d="M8,0 L35,18"/>
      <path d="M8,0 L35,-18"/>
      <path d="M-8,0 L-35,18"/>
      <path d="M-8,0 L-35,-18"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="35" cy="18" r="3" fill="#a855f7">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="35" cy="-18" r="3" fill="#3b82f6">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-35" cy="18" r="3" fill="#a855f7">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-35" cy="-18" r="3" fill="#3b82f6">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g opacity="0.12">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#a855f7" stroke-width="1"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke="#3b82f6" stroke-width="1"/>
    </g>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0">
      <animate attributeName="r" values="40;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="55" text-anchor="middle" font-family="monospace" font-size="7" fill="#a855f7" opacity="0.3">RAG</text>
  </g>
</svg>
